# One native Windows job that builds the portable desktop archive and runs the
# packaged acceptance smoke against it. The archive is deterministic
# (SOURCE_DATE_EPOCH fixed), so master/manual runs are reproducible; PR uploads
# carry seven-day retention. See docs/superpowers/plans/2026-08-14-windows-desktop-host.md
# Task 13 and the workflow policy test scripts/desktop-workflow.spec.ts.
name: Desktop packages (Windows and Android)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-portable-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  # One fixed epoch makes every release archive byte-identical for the same
  # source; the desktop builder refuses to run without it.
  SOURCE_DATE_EPOCH: '1700000000'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  portable:
    name: portable windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Developer Mode (symlink support)
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # Cache the pnpm store (locked by the lockfile), the Rust registry/git
      # and target (locked by the desktop Cargo.lock), and the verified Node
      # carrier ZIP (locked by its pin) so the native build is fast and
      # deterministic across runs.
      - uses: actions/cache@v4
        id: pnpm-store-cache
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-desktop-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-desktop-

      - uses: actions/cache@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-desktop-

      - uses: actions/cache@v4
        id: node-zip-cache
        with:
          path: dist/desktop/cache
          key: node-carrier-${{ hashFiles('scripts/release/desktop-node.json') }}

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run desktop-focused unit tests
        shell: pwsh
        run: >-
          pnpm exec vitest run
          packages/bundle/web-app/tests/runtime-identity.spec.ts
          packages/bundle/web-app/tests/global-image.spec.ts
          packages/host/apiproxy/tests/global-image.spec.ts
          packages/llm/llm-pi-ai/tests/global-image.spec.ts
          packages/fs/tool-fs/tests/global-image.spec.ts
          apps/cli/tests/parent-control.spec.ts
          scripts/release/desktop-runtime.spec.ts
          scripts/release/desktop-portable.spec.ts
          scripts/desktop-workflow.spec.ts

      - name: Run native desktop Rust tests
        shell: pwsh
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the portable archive
        shell: pwsh
        run: pnpm run desktop:build

      - name: Verify the SHA-256 checksum file
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/desktop/output/*.zip | Select-Object -First 1
          if (-not $zip) { throw 'no portable ZIP was produced' }
          $sha = Get-Content "$($zip.FullName).sha256" -TotalCount 1
          $expected = ($sha -split '\s+')[0]
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            throw "SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified for $($zip.Name)"

      - name: Smoke the packaged archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/desktop/output/*.zip | Select-Object -First 1
          if (-not $zip) { throw 'no portable ZIP was produced' }
          pwsh -NoProfile -File scripts/smoke-desktop-portable.ps1 -Archive $zip.FullName

      - name: Upload the archive, checksum, and metadata logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-portable-${{ github.sha }}
          path: |
            dist/desktop/output/*.zip
            dist/desktop/output/*.sha256
            dist/desktop/stage/VERSION.json
            dist/desktop/stage/README.txt
          if-no-files-found: error
          retention-days: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' && 0 || 7 }}

  android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    name: remote client android arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3

      - name: Install Android API, build tools, and NDK
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-arm64-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/tauri.conf.json') }}
          restore-keys: |
            android-arm64-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Generate Android Gradle project
        run: pnpm run desktop:android:init -- --ci --skip-targets-install

      - name: Build ARM64 APK and AAB
        run: pnpm run desktop:android:build -- --apk --aab --target aarch64

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: desktop-android-arm64-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/**/*.apk
            apps/desktop/src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 7
