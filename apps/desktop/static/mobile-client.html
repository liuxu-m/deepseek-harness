<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151b">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
      background: #10151b;
      color: #edf2f4;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 20px; background: #10151b; }
    main { width: min(100%, 430px); border-top: 3px solid #ef8354; padding: 30px 0 8px; }
    .kicker { margin: 0 0 18px; color: #ef8354; font: 600 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { max-width: 12ch; margin: 0; font-size: clamp(34px, 10vw, 54px); font-weight: 500; line-height: 0.98; }
    p { max-width: 34rem; margin: 22px 0 28px; color: #aeb9c0; font-size: 16px; line-height: 1.7; }
    label { display: block; margin-bottom: 9px; color: #d6dde0; font-size: 14px; }
    input { width: 100%; min-height: 52px; border: 1px solid #3b4850; border-radius: 4px; padding: 0 14px; outline: 0; background: #171e25; color: #edf2f4; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
    input:focus { border-color: #ef8354; box-shadow: 0 0 0 3px #ef835433; }
    button { width: 100%; min-height: 52px; margin-top: 14px; border: 0; border-radius: 4px; background: #ef8354; color: #10151b; cursor: pointer; font: 700 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
    button:active { transform: translateY(1px); }
    .status { min-height: 24px; margin: 14px 0 0; color: #efb8a0; font-size: 13px; }
    .hint { margin-top: 40px; color: #74818a; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Remote client / Android</p>
    <h1>连接你的 Harness</h1>
    <p>输入电脑上 DeepSeek Harness Web Host 的地址。手机只负责访问界面，Agent 和工具仍在电脑上运行。</p>
    <form id="connect-form">
      <label for="remote-url">电脑地址</label>
      <input id="remote-url" name="remote-url" type="url" inputmode="url" autocomplete="url" placeholder="https://harness.example.com" required>
      <button type="submit">连接电脑</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
    <div class="hint">仅连接受访问控制保护的 HTTPS 地址。不要暴露电脑上的裸服务端口。</div>
  </main>
  <script>
    const input = document.querySelector('#remote-url');
    const form = document.querySelector('#connect-form');
    const status = document.querySelector('#status');
    const saved = localStorage.getItem('dsh.remote-url');
    if (saved) input.value = saved;

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim().replace(/\/$/, '');
      let parsed;
      try { parsed = new URL(value); } catch { parsed = null; }
      if (!parsed || parsed.protocol !== 'https:' || !parsed.hostname) {
        status.textContent = '请输入有效且受保护的 https:// 地址。';
        input.focus();
        return;
      }
      localStorage.setItem('dsh.remote-url', value);
      status.textContent = '正在连接…';
      window.location.replace(value);
    });
  </script>
</body>
</html>
